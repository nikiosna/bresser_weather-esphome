# Example ESPHome configuration for Bresser Weather Sensor
# Copy this to your ESPHome config directory and customize

substitutions:
  device_name: bresser-weather
  friendly_name: Bresser Weather Station

esphome:
  name: ${device_name}

# --- Board selection (uncomment one) ---

# Option A: Wemos D1 Mini (ESP8266) with external CC1101
# esp8266:
#   board: d1_mini
# spi:
#   clk_pin: GPIO14  # D5
#   miso_pin: GPIO12 # D6
#   mosi_pin: GPIO13 # D7

# Option B: Heltec WiFi LoRa 32 V3 (ESP32-S3) with onboard SX1262
esp32:
  board: heltec_wifi_lora_32_V3
  variant: esp32s3
  framework:
    type: arduino

# External component - use from GitHub after publishing
external_components:
  # After publishing to GitHub, use this:
  # - source: github://YOUR_USERNAME/bresser-esphome@main
  #   components: [ bresser_weather ]

  # For local development:
  - source:
      type: local
      path: components

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot
  ap:
    ssid: "${device_name} Fallback"
    password: !secret fallback_password

captive_portal:

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_key

# Enable OTA updates
ota:
  - platform: esphome
    password: !secret ota_password

# Optional: Web server for debugging (uses extra memory)
web_server:
  port: 80

# Bresser Weather Sensor Component
bresser_weather:
  # Radio module: cc1101 (default) or sx1262
  # For Heltec WiFi LoRa 32 V3 use sx1262 with its onboard LoRa pins:
  radio_module: sx1262
  cs_pin: 8
  irq_pin: 14   # DIO1
  rst_pin: 12
  busy_pin: 13
  spi_clk_pin: 9
  spi_mosi_pin: 10
  spi_miso_pin: 11
  # For D1 Mini + CC1101 you can omit all pin options (defaults apply):
  # radio_module: cc1101

  filter_sensor_id: 0x00001F11 # Only accept data from this sensor ID
  temperature:
    name: "Temperature"
  humidity:
    name: "Humidity"
  wind_gust:
    name: "Wind Gust"
  wind_speed:
    name: "Wind Speed"
  wind_direction:
    name: "Wind Direction"
  rain:
    name: "Rain"
  uv:
    name: "UV Index"
  light:
    name: "Light"
  rssi:
    name: "RSSI"
  battery_ok:
    name: "Battery OK"
  sensor_id:
    name: "Sensor ID"
